name: Rebuild and publish the Docker image for Obstracts Web Staging

on:
  workflow_dispatch:

concurrency:
  group: package-publish-${{ github.repository }}
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/obstracts_web_staging
  PACKAGE_NAME: obstracts_web_staging

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Verify staging ref
        if: github.ref != 'refs/heads/staging'
        run: |
          echo "Staging images may only be rebuilt from the staging branch." >&2
          exit 1
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-staging-,format=long
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DJANGO_DEBUG=True
            USE_S3_STORAGE=1
            R2_ACCESS_KEY=12763a8c243ac6fe8d37fff77a966b70
            R2_CUSTOM_DOMAIN=static.obstracts.staging.signalscorps.com
            R2_BUCKET_NAME=obstracts-web-core-staging
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Apply channel-aware GHCR retention
        env:
          EXPECTED_CHANNEL: staging
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/cleanup-ghcr-versions.mjs
