name: Create and publish the Docker image for Obstracts Web Production

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: package-publish-${{ github.repository }}
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/obstracts_web_production
  PACKAGE_NAME: obstracts_web_production

jobs:
  dispatch-channel-build:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch production build from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production-image.yml --repo "${{ github.repository }}" --ref main
      - name: Summarize redirected build
        run: |
          echo '### Build redirected' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run redirected the production image build to main. The actual build and attestation run separately.' >> "$GITHUB_STEP_SUMMARY"

  build-and-push-image:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod
            type=sha,prefix=sha-prod-,format=long
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USE_S3_STORAGE=1
            R2_ACCESS_KEY=63337c0d7032845f17a6647215bbdadf
            R2_CUSTOM_DOMAIN=static.obstracts.com
            R2_BUCKET_NAME=obstracts-web-core-production
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Apply channel-aware GHCR retention
        env:
          EXPECTED_CHANNEL: prod
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/cleanup-ghcr-versions.mjs
